[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taiwan-invoice-account-classifier"
version = "0.1.0"
description = "台灣電子發票會計科目分類系統 — 稅務輔助與風險提示工具（非稅務或法律意見）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Taiwan Invoice Account Classifier Contributors" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "jieba>=0.42.1",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "joblib>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"invoice_classifier" = ["assets/*.txt"]
